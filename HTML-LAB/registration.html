<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    
    <form>
        
        <label for="Fullname">Full Name:</label>
        <input type="text" id="Fullname" name="Fullname" placeholder="Enter your name" minlength="0" maxlength="30" required>
        <br><br>

        <label for="studentID">Student ID:</label>
        <input type="text" id="studentID" name="studentID" placeholder="00-0000-000" minlength="0" maxlength="11" required>
        <br><br>

        <label for="Email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" minlength="0" maxlength="30" required>
        <br><br>

        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password" placeholder="Enter your Password" minlength="0" maxlength="30" required>
        <br><br>

        <label for="Birthday">Birthday:</label>
        <input type="date" id="Birthday" name="Birthday">
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="Gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="Gender" value="Female">
        <label for="female">Female</label>
        <br><br>
        <label for="program">Program:</label>
        <select name="program" id="program" required>

            <option value="">-- Select Program --</option>
            <option value="BSIT">BS Information Technology</option>
            <option value="BSCS">BS Computer Science</option>
            <option value="BSIS">BS Information System</option>
        </select>
        <br><br>

        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" name="hobbies" id="Gaming"> Gaming
        <input type="checkbox" name="hobbies" id="Music"> Music
        <input type="checkbox" name="hobbies" id="Sports"> Sports
        <input type="checkbox" name="hobbies" id="Reading"> Reading
        <br><br>

        <label>Address:</label><br>
        <textarea name="Address" rows="3" cols="40"></textarea>
        <br><br>

        <label>Comments:</label><br>
        <textarea name="Comments" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>


</body>
</html>
